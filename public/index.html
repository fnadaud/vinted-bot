<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted Listings | Modern Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="header-text">
                <h1>Vinted Listings</h1>
                <p>Discover amazing deals</p>
            </div>
            <button id="refreshBtn" onclick="refreshData()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.5l5.8 5.8"/></svg>
                Refresh
            </button>
        </header>
        
        <div id="status" class="status">Loading amazing deals...</div>
        <div id="results-container"></div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
